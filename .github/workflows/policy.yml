name: Plugin policy checks
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash test/smoke.sh
      - run: bash test/ui-policy.sh
      - run: node --test test/pi-adapter.mjs
      - run: node --test test/claude-child.mjs
      - run: python3 test/repository-guardrails.py
