name: Plugin policy checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash test/smoke.sh
      - run: bash test/ui-policy.sh
